name: grani57_app
description: "Production foundation for the 57 ГРАНЕЙ mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: 2.0.26
  flutter_svg: ^2.3.0
  pdf: ^3.13.1
  permission_handler: ^12.0.1
  printing: ^5.15.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  yandex_maps_mapkit_lite: ^4.42.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.2

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icons/actions/
    - assets/icons/brand/
    - assets/icons/content/
    - assets/icons/documents/
    - assets/icons/doctor/
    - assets/icons/forms/
    - assets/icons/navigation/
    - assets/icons/profile/
    - assets/icons/status/
    - assets/images/brand/
    - assets/images/doctors/
    - assets/images/maps/
    - assets/images/publications/
    - assets/images/booking/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
